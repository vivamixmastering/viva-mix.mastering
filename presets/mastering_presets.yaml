      parallel: {threshold_db: -36, ratio: 10, mix: 0.28}
      eq_low_shelf: {freq: 120, gain_db: 1.5}
      eq_dip: {freq: 2000, gain_db: -2.0, q: 1.5}
      eq_presence: {freq: 3500, gain_db: 3.0, q: 1.0}
      eq_air_shelf: {freq: 14000, gain_db: 1.5}
      deess: {threshold_db: -22, ratio: 6, freq: 6000}
      warmth: {drive_db: 3.5, mix: 0.35}
      air: {freq: 11000, drive_db: 2.5, mix: 0.35}
      delay: {time_s: 0.15, feedback: 0.3, mix: 0.06}
      reverb: {room: 0.25, damping: 0.6, wet: 0.08}
      out_lufs: -18
    mix: {vocal_gain_db: 1.0, inst_gain_db: -4.0, duck_db: 3.5}
    master:
      working_lufs: -18
      hpf_hz: 28
      eq_dip: {freq: 300, gain_db: -1.5, q: 1.2}
      bus_comp: {threshold_db: -14, ratio: 2.0, attack_ms: 10, release_ms: 200}
