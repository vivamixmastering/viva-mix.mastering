# ۱۰ پریست میکس و مستر — بر اساس زنجیره‌های واقعی مهندس‌های معروف دنیا
# (Serban Ghenea / John Hanes / Chris Lord-Alge / Manny Marroquin / Randy Merrill)
# زنجیره وکال:  HPF → کالیبراسیون → اتوتیون ملوداینی (تشخیص گام + حفظ تحریر)
#   → لولر → ۱۱۷۶ → LA-2A → کمپرسور موازی NY → EQ → دی‌اسر → گرماساز → هوا → اکو → ریورب
# زنجیره مستر:  کالیبراسیون → HPF → EQ اصلاحی → کمپرسور باس → EQ تُنال → پهنا
#   → اشباع → کلیپر نرم → لیمیتر چندگذره → LUFS
#
# ⚠️ از این نسخه همهٔ پریست‌ها «کالیبره» هستن: ورودی اول به working_lufs
# آورده می‌شه، بعد آستانهٔ کمپرسورها معنای ثابت دارن — نتیجه روی هر فایلی
# یکسانه و دیگه وکال بلند «مچاله» نمی‌شه.
presets:
  # ۱ ──────────────────────────────────────────────
  - id: pop_radio
    name: "📻 پاپ رادیویی"
    desc: "براق و جلو، به سبک وکال‌های رادیویی سران گنه‌آ — برای پاپ روز"
    vocal:
      hpf_hz: 100
      working_lufs: -20
      tune: {strength: 0.55, snap: 50, scale: chromatic, vibrato_keep: 0.85}
      comp1: {threshold_db: -13, ratio: 3.5, attack_ms: 2.5, release_ms: 60}
      comp2: {threshold_db: -15, ratio: 2.6, attack_ms: 12, release_ms: 220}
      parallel: {threshold_db: -38, ratio: 8, mix: 0.22}
      eq_low_shelf: {freq: 110, gain_db: 2.5}
      eq_dip: {freq: 1800, gain_db: -2.5, q: 1.6}
      eq_presence: {freq: 3200, gain_db: 3.0, q: 1.0}
      eq_air_shelf: {freq: 12000, gain_db: 2.5}
      deess: {freq: 6500, threshold_db: -24, ratio: 5, makeup_db: 1.5}
      warmth: {drive_db: 2.5, mix: 0.25}
      air: {freq: 10000, drive_db: 2.0, mix: 0.3}
      delay: {time_s: 0.19, feedback: 0.25, mix: 0.08}
      reverb: {room: 0.35, damping: 0.5, wet: 0.13}
      out_lufs: -18
    mix: {vocal_gain_db: 1.0, inst_gain_db: -3.5, duck_db: 3.5}
    master:
      working_lufs: -18
      hpf_hz: 25
      eq_dip: {freq: 300, gain_db: -1.0, q: 1.2}
      bus_comp: {threshold_db: -14, ratio: 1.8, attack_ms: 20, release_ms: 250}
      eq_low_shelf: {freq: 80, gain_db: 1.5}
      eq_high_shelf: {freq: 10000, gain_db: 1.0}
      width: 1.10
      sat: {drive_db: 1.5, mix: 0.15}
      clip: {ceiling_db: -2.2}
      lufs: -9
      ceiling: -1.0
  # ۲ ──────────────────────────────────────────────
  - id: club_energy
    name: "🔥 کلابی پرانرژی"
